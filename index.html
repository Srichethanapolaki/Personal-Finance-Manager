<!DOCTYPE html>
<html>
<head>
    <title>Welcome</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-box">
    <h2>💰 Personal Finance Manager</h2>
    <p>Manage your money smartly</p>
    <button onclick="openLogin()">Login</button>
    <p>New user? <a href="register.html">Register</a></p>
</div>

<!-- Login Modal -->
<div class="modal-overlay" id="loginOverlay">
    <div class="modal-box">
        <h3>Welcome Back 👋</h3>
        <p style="color:#6b7280;">Login to your account</p>

        <input type="email" id="loginEmail" placeholder="Email address">
        <input type="password" id="loginPassword" placeholder="Password">

        <button onclick="login()">Login</button>
        <button class="cancel-btn" onclick="closeLogin()">Cancel</button>
    </div>
</div>

<script src="js/auth.js"></script>

<script>
function openLogin() {
    let o = document.getElementById("loginOverlay");
    o.style.display = "flex";
    setTimeout(() => o.classList.add("show"), 10);
}

function closeLogin() {
    let o = document.getElementById("loginOverlay");
    o.classList.remove("show");
    setTimeout(() => o.style.display = "none", 300);
}
</script>

</body>
</html>
